<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="粘贴网址，一键提取网站 favicon 图标地址，支持复制。Cloudflare Pages 同域代理，服务端抓取解析">
<title>网站图标地址提取工具</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --fg: #171717;
        --fg-muted: #666;
        --fg-faint: #999;
        --border: #e5e5e5;
        --card: #fff;
        --bg: #fafafa;
        --accent: #0070f3;
        --danger-bg: #fef2f2;
        --danger-border: #fecaca;
        --danger-fg: #dc2626;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                     "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 48px 16px;
    }

    .container { width: 100%; max-width: 640px; }

    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 24px; font-weight: 700; letter-spacing: -.3px; }
    header p { font-size: 14px; color: var(--fg-muted); margin-top: 8px; }

    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    }

    .input-row { display: flex; gap: 8px; flex-wrap: wrap; }
    #urlInput {
        flex: 1 1 200px;
        min-width: 0;
        height: 42px;
        padding: 0 14px;
        font-size: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        outline: none;
        transition: border-color .15s, box-shadow .15s;
    }
    #urlInput:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(0,112,243,.15);
    }
    #urlInput::placeholder { color: #aaa; }

    button {
        font-family: inherit;
        cursor: pointer;
        border: 0;
        border-radius: 8px;
        font-weight: 500;
        transition: background .15s, opacity .15s;
        -webkit-user-select: none;
        user-select: none;
    }
    button:disabled { cursor: not-allowed; opacity: .6; }

    #btnExtract {
        height: 42px;
        padding: 0 22px;
        font-size: 14px;
        background: var(--fg);
        color: #fff;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }
    #btnExtract:hover:not(:disabled) { background: #333; }

    .spinner {
        width: 14px; height: 14px;
        border: 2px solid rgba(255,255,255,.35);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin .7s linear infinite;
        display: none;
    }
    #btnExtract.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
        margin-top: 14px;
        padding: 10px 12px;
        font-size: 13px;
        line-height: 1.5;
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
        color: var(--danger-fg);
        border-radius: 8px;
    }

    .result { margin-top: 16px; }
    .result-head { display: flex; align-items: center; gap: 14px; }
    #iconPreview {
        width: 48px; height: 48px;
        flex: none;
        object-fit: contain;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 3px;
        background: #fff;
    }
    .result-url {
        flex: 1;
        min-width: 0;
        font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
        font-size: 13px;
        line-height: 1.5;
        word-break: break-all;
        background: #f5f5f5;
        border: 1px solid #eee;
        border-radius: 8px;
        padding: 10px 12px;
    }

    .result-actions {
        margin-top: 14px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    #btnCopy {
        height: 36px;
        padding: 0 16px;
        font-size: 13px;
        background: #fff;
        border: 1px solid var(--border);
        color: var(--fg);
    }
    #btnCopy:hover { background: #f5f5f5; }
    #btnCopy.copied { border-color: #16a34a; color: #16a34a; background: #f0fdf4; }

    #linkVisit {
        font-size: 13px;
        color: var(--accent);
        text-decoration: none;
    }
    #linkVisit:hover { text-decoration: underline; }

    #sourceNote { font-size: 12px; color: var(--fg-faint); }

    footer {
        margin-top: 28px;
        text-align: center;
        font-size: 12px;
        color: var(--fg-faint);
        line-height: 1.8;
    }

    .hidden { display: none !important; }
</style>
</head>
<body>
<main class="container">
    <header>
        <h1>网站图标地址提取工具</h1>
        <p>粘贴网址，服务端抓取并解析 favicon 图标完整地址</p>
    </header>

    <div class="card">
        <div class="input-row">
            <input id="urlInput" type="text" spellcheck="false"
                   placeholder="粘贴网站地址，如 https://www.github.com" autocomplete="off">
            <button id="btnExtract"><span class="spinner"></span><span id="btnExtractText">提取</span></button>
        </div>
        <div id="errorBox" class="error hidden"></div>
    </div>

    <div id="resultCard" class="card result hidden">
        <div class="result-head">
            <img id="iconPreview" alt="图标预览">
            <div class="result-url" id="iconUrl"></div>
        </div>
        <div class="result-actions">
            <button id="btnCopy">📋 复制地址</button>
            <a id="linkVisit" href="#" target="_blank" rel="noopener">在新标签页打开 ↗</a>
            <span id="sourceNote"></span>
        </div>
    </div>

    <footer>
        抓取与图标转发由 Cloudflare Pages Functions 同域完成（/api/extract · /api/icon）<br>
        提取优先级：rel="icon" → rel="shortcut icon" → rel="apple-touch-icon" → /favicon.ico → DuckDuckGo 图标
    </footer>
</main>

<script>
(function() {
    'use strict';

    var PLACEHOLDER = 'data:image/svg+xml,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48">' +
        '<rect width="48" height="48" rx="8" fill="#f0f0f0"/>' +
        '<text x="24" y="30" text-anchor="middle" font-size="20" fill="#bbb">?</text></svg>');

    var input = document.getElementById('urlInput');
    var btnExtract = document.getElementById('btnExtract');
    var btnExtractText = document.getElementById('btnExtractText');
    var errorBox = document.getElementById('errorBox');
    var resultCard = document.getElementById('resultCard');
    var iconPreview = document.getElementById('iconPreview');
    var iconUrl = document.getElementById('iconUrl');
    var btnCopy = document.getElementById('btnCopy');
    var linkVisit = document.getElementById('linkVisit');
    var sourceNote = document.getElementById('sourceNote');

    function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove('hidden');
    }
    function clearError() { errorBox.classList.add('hidden'); }

    function setLoading(on) {
        btnExtract.disabled = on;
        btnExtract.classList.toggle('loading', on);
        btnExtractText.textContent = on ? '提取中…' : '提取';
    }

    function showResult(data) {
        iconPreview.onerror = function() { iconPreview.src = PLACEHOLDER; };
        iconPreview.src = data.preview;   /* 同域代理地址，被墙图标也能显示 */
        iconUrl.textContent = data.url;   /* 真实完整图标地址，供复制 */
        linkVisit.href = data.preview;
        sourceNote.textContent = data.source ? '来源：' + data.source : '';
        resultCard.classList.remove('hidden');
    }

    function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text).then(function() { return true; }, function() { return legacyCopy(text); });
        }
        return Promise.resolve(legacyCopy(text));
    }
    function legacyCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        return ok;
    }

    function extract() {
        clearError();
        resultCard.classList.add('hidden');

        var raw = input.value.trim();
        if (!raw) { showError('请输入网址'); return; }

        var target;
        try {
            target = new URL(/^https?:\/\//i.test(raw) ? raw : 'https://' + raw);
        } catch (e) {
            showError('网址格式不正确，请检查后重试');
            return;
        }

        setLoading(true);

        fetch('/api/extract?url=' + encodeURIComponent(target.href))
            .then(function(res) {
                return res.json().catch(function() { return null; }).then(function(data) { return { res: res, data: data }; });
            })
            .then(function(r) {
                if (!r.res.ok || !r.data || !r.data.ok) {
                    var msg = (r.data && r.data.error) ? r.data.error : '未找到图标，请检查网址是否正确';
                    showError(msg);
                    return;
                }
                showResult(r.data);
            })
            .catch(function() {
                showError('请求失败，请检查网络后重试');
            })
            .then(function() { setLoading(false); });
    }

    btnExtract.addEventListener('click', extract);
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') extract();
    });

    btnCopy.addEventListener('click', function() {
        copyText(iconUrl.textContent).then(function(ok) {
            if (!ok) { showError('复制失败，请手动选中文本复制'); return; }
            clearError();
            btnCopy.textContent = '已复制 ✓';
            btnCopy.classList.add('copied');
            setTimeout(function() {
                btnCopy.textContent = '📋 复制地址';
                btnCopy.classList.remove('copied');
            }, 1500);
        });
    });
})();
</script>
</body>
</html>
