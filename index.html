<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="粘贴网址，一键提取网站 favicon 图标地址，支持复制。Cloudflare Pages 同域代理，服务端抓取解析">
<link rel="icon" href="static/icon/favicon.ico" type="image/x-icon">
<title>网站图标地址提取工具</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --fg: #0f172a;
        --fg-muted: #64748b;
        --fg-faint: #94a3b8;
        --border: #e2e8f0;
        --card: #ffffff;
        --bg: #f4f6fb;
        --accent: #4f6ef7;
        --accent-deep: #3b5bdb;
        --accent-soft: rgba(79, 110, 247, .14);
        --code-bg: #0f172a;
        --code-fg: #cbd5e1;
        --danger-bg: #fef2f2;
        --danger-border: #fecaca;
        --danger-fg: #b91c1c;
        --ok: #059669;
        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-sm: 10px;
        --shadow-card: 0 1px 2px rgba(15, 23, 42, .05), 0 12px 32px -12px rgba(15, 23, 42, .18);
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                     "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
        /* body 保持基础纯色，压缩图模糊层与高清层由下层 div 承载 */
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: clamp(32px, 6vw, 64px) 16px;
        position: relative;
        overflow-x: hidden;
    }

    /* 背景装饰光斑 */
    body::before, body::after {
        content: "";
        position: fixed;
        z-index: -1;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.5;
        pointer-events: none;
    }
    body::before {
        width: 480px; height: 480px;
        background: rgba(79, 110, 247, .16);
        top: -160px; right: -120px;
    }
    body::after {
        width: 420px; height: 420px;
        background: rgba(129, 140, 248, .14);
        bottom: -140px; left: -120px;
    }

    /* 压缩图模糊层：初始立即显示，高斯模糊实现毛玻璃效果 */
    #bgBlur {
        position: fixed;
        inset: 0;
        z-index: -2;
        background: url('static/img/background.webp') no-repeat center center / cover;
        filter: blur(10px);
        transform: scale(1.1);          /* 放大避免模糊后边缘露底色 */
        pointer-events: none;
    }

    /* 高清背景层：默认隐藏，高清图加载完成后淡入，不阻塞页面交互 */
    #bgLayer {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: var(--bg) no-repeat center center / cover;
        opacity: 0;
        transition: opacity .8s ease;
        pointer-events: none;
    }
    #bgLayer.loaded { opacity: 1; }

    .container { width: 100%; max-width: 620px; }

    header { text-align: center; margin-bottom: 32px; }
    header h1 {
        font-size: clamp(22px, 4.5vw, 28px);
        font-weight: 800;
        letter-spacing: -.5px;
        background: linear-gradient(120deg, #0f172a 30%, var(--accent-deep));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    header p {
        font-size: 14px;
        color: var(--fg-muted);
        margin-top: 12px;
        display: inline-block;
        padding: 6px 16px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 999px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
    }

    /* ===== 输入卡片（原样，无蛇干扰） ===== */
    .card {
        background: var(--card);
        border: 2px solid #1e293b;
        border-radius: var(--radius-lg);
        padding: 22px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, .18), 0 2px 6px rgba(0, 0, 0, .12);
    }

    .input-row { display: flex; gap: 10px; flex-wrap: wrap; }
    #urlInput {
        flex: 1 1 220px;
        min-width: 0;
        height: 46px;
        padding: 0 15px;
        font-size: 14px;
        font-family: inherit;
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        outline: none;
        background: #fbfcfe;
        transition: border-color .15s, box-shadow .15s, background .15s;
    }
    #urlInput:hover { border-color: #cbd5e1; }
    #urlInput:focus {
        border-color: var(--accent);
        background: #fff;
        box-shadow: 0 0 0 4px var(--accent-soft);
    }
    #urlInput::placeholder { color: #a8b3c5; }

    button {
        font-family: inherit;
        cursor: pointer;
        border: 0;
        font-weight: 600;
        transition: background .15s, border-color .15s, color .15s,
                    transform .12s, box-shadow .15s, filter .15s;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
    }
    button:disabled { cursor: not-allowed; opacity: .65; }
    button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }

    #btnExtract {
        height: 46px;
        padding: 0 24px;
        font-size: 14.5px;
        color: #fff;
        border-radius: var(--radius-md);
        background: linear-gradient(135deg, #5b7cfa, var(--accent-deep));
        box-shadow: 0 6px 16px -6px rgba(59, 91, 219, .55);
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }
    #btnExtract:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 10px 22px -6px rgba(59, 91, 219, .6);
        filter: saturate(1.1);
    }
    #btnExtract:active:not(:disabled) { transform: translateY(0) scale(.97); }

    .spinner {
        width: 14px; height: 14px;
        border: 2px solid rgba(255, 255, 255, .35);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin .7s linear infinite;
        display: none;
    }
    #btnExtract.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
        margin-top: 14px;
        padding: 12px 14px;
        font-size: 13px;
        line-height: 1.55;
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
        color: var(--danger-fg);
        border-radius: var(--radius-md);
        display: flex;
        gap: 8px;
        align-items: flex-start;
        animation: fadeUp .3s cubic-bezier(.2, .8, .3, 1);
    }
    .error::before { content: "⚠️"; flex: none; }

    .result {
        margin-top: 16px;
        animation: fadeUp .35s cubic-bezier(.2, .8, .3, 1);
    }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: none; }
    }

    .result-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    #iconPreview {
        width: 56px; height: 56px;
        flex: none;
        object-fit: contain;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 4px;
        background: repeating-conic-gradient(#f1f5f9 0 25%, #fff 0 50%) 0 0 / 12px 12px;
    }
    .result-url {
        flex: 1 1 260px;
        min-width: 0;
        font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
        font-size: 12.5px;
        line-height: 1.6;
        word-break: break-all;
        background: var(--code-bg);
        color: var(--code-fg);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        box-shadow: inset 0 1px 4px rgba(0, 0, 0, .4);
    }

    .result-actions {
        margin-top: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    #btnCopy {
        height: 38px;
        padding: 0 18px;
        font-size: 13px;
        background: #fff;
        border: 1.5px solid #1e293b;
        color: var(--fg);
        border-radius: var(--radius-sm);
        box-shadow: 0 3px 10px -2px rgba(15, 23, 42, .45);
    }
    #btnCopy:hover:not(:disabled) { background: #f8fafc; transform: translateY(-1px); box-shadow: 0 5px 14px -2px rgba(15, 23, 42, .5); }
    #btnCopy:active:not(:disabled) { transform: scale(.97); }
    #btnCopy.copied { border-color: #34d399; color: var(--ok); background: #ecfdf5; box-shadow: 0 3px 10px -2px rgba(5, 150, 105, .35); }

    #linkVisit {
        font-size: 13px;
        font-weight: 600;
        color: var(--accent-deep);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        height: 38px;
        padding: 0 16px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        transition: border-color .15s, background .15s, transform .12s, box-shadow .15s;
    }
    #linkVisit:hover {
        border-color: var(--accent);
        background: #f5f7ff;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px -4px rgba(59, 91, 219, .35);
    }
    #linkVisit:active { transform: scale(.97); }

    #sourceNote { font-size: 12px; color: var(--fg-faint); }

    footer {
        margin-top: 32px;
        text-align: center;
        font-size: 12px;
        color: var(--fg-faint);
        line-height: 1.9;
    }

    .hidden { display: none !important; }

    /* ===== 新增：独立蛇模块（在输入卡片下方，留足空间，带透视效果） ===== */
.snake-module {
    margin-top: 30px;          /* 与输入卡片保持距离，可自行调整 */
    padding: 0px 0;           /* 上下留一点空间，让蛇图不紧贴上下边缘（可选） */
    display: flex;
    justify-content: center;
    align-items: center;
    /* 移除所有背景、边框、阴影、模糊 */
}

    .snake-module img {
        display: block;
        width: 140%;                    /* 占满模块宽度 */
        max-width: 700px;               /* 限制最大宽度，避免过大 */
        height: auto;                   /* 保持纵横比，防止拉伸变形 */
        filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
        -webkit-user-drag: none;        /* 禁止拖拽 */
        user-select: none;              /* 禁止选中 */
        -webkit-user-select: none;
        pointer-events: none;           /* 不接收鼠标点击事件 */
    }

    /* 移动端适配 */
    @media (max-width: 520px) {
        .card { padding: 16px; border-radius: 14px; }
        header { margin-bottom: 24px; }
        header p { font-size: 13px; padding: 5px 12px; }
        #urlInput { height: 48px; font-size: 16px; }
        #urlInput, #btnExtract { border-radius: var(--radius-sm); }
        #btnExtract { flex: 1 1 100%; justify-content: center; }
        #iconPreview { width: 44px; height: 44px; }
        .result-head, .result-actions { gap: 10px; }
        body::before, body::after { opacity: .35; }
        #bgBlur { filter: blur(6px); }  /* 移动端降低模糊，兼顾性能 */
        .snake-module {
            min-height: 160px;
            padding: 20px 15px;
        }
        .snake-module img { max-width: 300px; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
    }
</style>
</head>
<body>
<!-- 压缩图模糊层（毛玻璃效果，初始立即显示） -->
<div id="bgBlur" aria-hidden="true"></div>
<!-- 高清背景层（background1.webp 异步加载完成后淡入） -->
<div id="bgLayer" aria-hidden="true"></div>
<main class="container">
    <header>
        <h1>网站图标地址提取工具</h1>
    </header>

    <!-- 输入卡片（原样） -->
    <div class="card">
        <div class="input-row">
            <input id="urlInput" type="text" spellcheck="false"
                   placeholder="粘贴网站地址，如 https://www.github.com" autocomplete="off">
            <button id="btnExtract"><span class="spinner"></span><span id="btnExtractText">提取</span></button>
        </div>
        <div id="errorBox" class="error hidden"></div>
    </div>

    <!-- 结果卡片 -->
    <div id="resultCard" class="card result hidden">
        <div class="result-head">
            <img id="iconPreview" alt="图标预览">
            <div class="result-url" id="iconUrl"></div>
        </div>
        <div class="result-actions">
            <button id="btnCopy">📋 复制地址</button>
            <a id="linkVisit" href="#" target="_blank" rel="noopener">在新标签页打开 ↗</a>
            <span id="sourceNote"></span>
        </div>
    </div>

    <!-- ===== 独立蛇模块（置于最底部，确保结果卡片渲染在其上层） ===== -->
    <div class="snake-module">
        <img src="static/svg/snake-Light.svg" alt="动态贪吃蛇" draggable="false">
    </div>

</main>

<script>
//（原有 JavaScript 完全保留，未做任何改动）
(function() {
    'use strict';

    var PLACEHOLDER = 'data:image/svg+xml,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48">' +
        '<rect width="48" height="48" rx="8" fill="#f0f0f0"/>' +
        '<text x="24" y="30" text-anchor="middle" font-size="20" fill="#bbb">?</text></svg>');

    var input = document.getElementById('urlInput');
    var btnExtract = document.getElementById('btnExtract');
    var btnExtractText = document.getElementById('btnExtractText');
    var errorBox = document.getElementById('errorBox');
    var resultCard = document.getElementById('resultCard');
    var iconPreview = document.getElementById('iconPreview');
    var iconUrl = document.getElementById('iconUrl');
    var btnCopy = document.getElementById('btnCopy');
    var linkVisit = document.getElementById('linkVisit');
    var sourceNote = document.getElementById('sourceNote');

    function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove('hidden');
    }
    function clearError() { errorBox.classList.add('hidden'); }

    function setLoading(on) {
        btnExtract.disabled = on;
        btnExtract.classList.toggle('loading', on);
        btnExtractText.textContent = on ? '提取中…' : '提取';
    }

    function showResult(data) {
        iconPreview.onerror = function() { iconPreview.src = PLACEHOLDER; };
        iconPreview.src = data.preview;
        iconUrl.textContent = data.url;
        linkVisit.href = data.preview;
        sourceNote.textContent = data.source ? '来源：' + data.source : '';
        resultCard.classList.remove('hidden');
    }

    function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text).then(function() { return true; }, function() { return legacyCopy(text); });
        }
        return Promise.resolve(legacyCopy(text));
    }
    function legacyCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        return ok;
    }

    function rootDomain(h) {
        var m = h.toLowerCase().match(/([a-z0-9-]+\.(?:com|net|org|gov|edu|ac|co)\.[a-z]{2})$/);
        if (m) return m[1];
        m = h.toLowerCase().match(/([a-z0-9-]+\.[a-z]{2,})$/);
        return m ? m[1] : h;
    }

    function probeImg(url) {
        return new Promise(function(resolve) {
            var img = new Image();
            var done = false;
            function finish(ok) {
                if (done) return;
                done = true;
                img.onload = img.onerror = null;
                resolve(ok);
            }
            var t = setTimeout(function() { finish(false); }, 6000);
            img.onload = function() { clearTimeout(t); finish(true); };
            img.onerror = function() { clearTimeout(t); finish(false); };
            img.src = url;
        });
    }

    function browserProbeIcon(target) {
        var origins = [target.origin];
        var rd = rootDomain(target.hostname);
        if (rd !== target.hostname) origins.push('https://' + rd);
        var paths = ['/favicon.ico', '/favicon.png', '/apple-touch-icon.png'];
        var candidates = [];
        origins.forEach(function(o) { paths.forEach(function(p) { candidates.push(o + p); }); });
        return Promise.all(candidates.map(probeImg)).then(function(results) {
            for (var i = 0; i < candidates.length; i++) {
                if (results[i]) return candidates[i];
            }
            return '';
        });
    }

    function normalizeUrl(text) {
        var s = text.replace(/\s+/g, '');
        s = s.replace(/^(https?):\/(?!\/)/i, '$1://');
        if (/^https?:\/\//i.test(s)) { return s; }
        if (s.indexOf('//') === 0) { return 'https:' + s; }
        return 'https://' + s;
    }

    function extract() {
        clearError();
        resultCard.classList.add('hidden');

        var raw = input.value.trim();
        if (!raw) { showError('请输入网址'); return; }

        var target;
        try {
            target = new URL(normalizeUrl(raw));
        } catch (e) {
            showError('网址格式不正确，请检查后重试');
            return;
        }

        setLoading(true);

        fetch('/api/extract?url=' + encodeURIComponent(target.href))
            .then(function(res) {
                return res.json().catch(function() { return null; }).then(function(data) { return { res: res, data: data }; });
            })
            .then(function(r) {
                var data = r.data && r.data.ok ? r.data : null;

                if (data && !data.fallback) { showResult(data); return null; }

                return browserProbeIcon(target).then(function(nativeUrl) {
                    if (nativeUrl) {
                        showResult({ url: nativeUrl, preview: nativeUrl, source: '本地探测 ' + nativeUrl.replace(/^https?:\/\//, '') });
                        return null;
                    }
                    if (data) { showResult(data); return null; }
                    showError((r.data && r.data.error) ? r.data.error : '未找到图标，请检查网址是否正确');
                });
            })
            .catch(function() {
                showError('请求失败，请检查网络后重试');
            })
            .then(function() { setLoading(false); });
    }

    btnExtract.addEventListener('click', extract);
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') extract();
    });

    btnCopy.addEventListener('click', function() {
        copyText(iconUrl.textContent).then(function(ok) {
            if (!ok) { showError('复制失败，请手动选中文本复制'); return; }
            clearError();
            btnCopy.textContent = '已复制 ✓';
            btnCopy.classList.add('copied');
            setTimeout(function() {
                btnCopy.textContent = '📋 复制地址';
                btnCopy.classList.remove('copied');
            }, 1500);
        });
    });
})();
</script>

<!-- 背景图加载：后台异步加载高清图，不阻塞页面交互，加载完成后淡入 -->
<script>
(function() {
    'use strict';
    var bg = document.getElementById('bgLayer');
    if (!bg) return;

    // 后台异步预加载高清图，成功后在 bgLayer 上平滑淡入
    var img = new Image();
    img.onload = function() {
        bg.style.backgroundImage = "url('static/img/background1.webp')";
        bg.classList.add('loaded');
    };
    // 加载失败则保持基础纯色背景，不影响页面
    img.src = 'static/img/background1.webp';
})();
</script>

<!-- 禁止贪吃蛇图片拖拽/选中：JS 级拦截，弥补 CSS 在不同浏览器上的兼容差异 -->
<script>
(function() {
    'use strict';
    var snakeImg = document.querySelector('.snake-module img');
    if (!snakeImg) return;

    // 阻止原生拖拽（含首次长按后浏览器将其置为可拖拽状态的场景）
    snakeImg.addEventListener('dragstart', function(e) {
        e.preventDefault();
        return false;
    }, true);
    // 阻止长按触发的系统拖拽/选中
    snakeImg.addEventListener('mousedown', function(e) {
        if (e.button === 0) e.preventDefault();
    }, true);
    // 阻止移动端长按系统菜单
    snakeImg.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    }, true);
})();
</script>

<!-- 防护脚本 -->
<script>
    (function() {
        'use strict';
        document.addEventListener('keydown', function(e) {
            var key = e.key || '';
            var blocked = false;
            if (key === 'F12') { blocked = true; }
            else if ((e.ctrlKey || e.metaKey) && !e.altKey && (key === 's' || key === 'S' || key === 'u' || key === 'U')) { blocked = true; }
            else if ((e.ctrlKey || e.metaKey) && e.shiftKey && (key === 'I' || key === 'i' || key === 'J' || key === 'j' || key === 'C' || key === 'c')) { blocked = true; }
            if (blocked) { e.preventDefault(); e.stopPropagation(); return false; }
        }, true);
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, true);
        function antiDebug() {
            setInterval(function() {
                var before = Date.now();
                debugger;
                if (Date.now() - before > 100) { document.body.innerHTML = ''; }
            }, 2000);
        }
        antiDebug();
    })();
</script>
</body>
</html>
