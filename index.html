let currentIndex = -1;
const chapters = [...new Set(data.map(x => x.chapter))];

function renderChapters() {
  const container = document.getElementById('chapterContainer');
  container.innerHTML = '';
  chapters.forEach((ch, idx) => {
    const lessons = data.map((lesson, i) => ({...lesson, index: i})).filter(x => x.chapter === ch);
    const html = `
      <div class="chapter ${idx === 0 ? 'open' : ''}" id="ch-${idx}">
        <div class="chapter-title" onclick="toggleChapter(${idx})">
          <span>📚 ${ch}（${lessons.length}节）</span>
          <span class="arrow">▶</span>
        </div>
        <div class="lesson-list">
          ${lessons.map(lesson => `
            <div class="lesson" data-index="${lesson.index}" onclick="openLesson(${lesson.index})">
              ${lesson.name}
            </div>
          `).join('')}
        </div>
      </div>
    `;
    container.innerHTML += html;
  });
}

function toggleChapter(idx) {
  document.getElementById('ch-' + idx).classList.toggle('open');
}

function openLesson(index) {
  currentIndex = index;
  const lesson = data[index];
  
  document.querySelectorAll('.lesson').forEach(el => el.classList.remove('active'));
  document.querySelectorAll(`.lesson[data-index="${index}"]`).forEach(el => el.classList.add('active'));
  
  document.getElementById('currentTitle').textContent = lesson.name;
  document.getElementById('playerControls').style.display = 'flex';
  
  // 用 Ruffle 嵌入播放同目录下的 SWF 文件
  document.getElementById('playerContent').innerHTML = 
    `<ruffle-player src="https://cdn.jsdelivr.net/gh/Elsht666/test-website-demo@main/swf/${lesson.swf}" style="width:100%;height:100%;"></ruffle-player>`;
  
  document.getElementById('prevBtn').disabled = (index === 0);
  document.getElementById('nextBtn').disabled = (index === data.length - 1);
  
  const activeEl = document.querySelector(`.lesson[data-index="${index}"]`);
  if (activeEl) activeEl.scrollIntoView({ block: 'center' });
}

function prevLesson() {
  if (currentIndex > 0) openLesson(currentIndex - 1);
}

function nextLesson() {
  if (currentIndex < data.length - 1) openLesson(currentIndex + 1);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') prevLesson();
  if (e.key === 'ArrowRight') nextLesson();
});

function searchLessons() {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!kw) { renderChapters(); return; }
  
  const container = document.getElementById('chapterContainer');
  const results = data.map((lesson, i) => ({...lesson, index: i})).filter(x => x.name.toLowerCase().includes(kw));
  container.innerHTML = `
    <div class="chapter open">
      <div class="chapter-title">
        <span>🔍 搜索结果（${results.length}节）</span>
      </div>
      <div class="lesson-list">
        ${results.map(lesson => `
          <div class="lesson" data-index="${lesson.index}" onclick="openLesson(${lesson.index})">
            [${lesson.chapter}] ${lesson.name}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  sb.style.display = sb.style.display === 'none' ? 'block' : 'none';
}

renderChapters();
</script>
