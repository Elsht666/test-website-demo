<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="粘贴 GitHub / 任意下载链接，一键生成多通道加速下载地址（自建 + gh-proxy 系列 + 镜像站 + 自定义前缀），复制即用">
<link rel="icon" href="static/icon/favicon.ico" type="image/x-icon">
<title>下载加速器</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --fg: #0f172a;
        --fg-muted: #64748b;
        --fg-faint: #94a3b8;
        --border: #e2e8f0;
        --card: #ffffff;
        --bg: #f4f6fb;
        --accent: #4f6ef7;
        --accent-deep: #3b5bdb;
        --accent-soft: rgba(79, 110, 247, .14);
        --code-bg: #0f172a;
        --code-fg: #cbd5e1;
        --danger-bg: #fef2f2;
        --danger-border: #fecaca;
        --danger-fg: #b91c1c;
        --ok: #059669;
        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-sm: 10px;
        --shadow-card: 0 1px 2px rgba(15, 23, 42, .05), 0 12px 32px -12px rgba(15, 23, 42, .18);
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                     "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
        /* body 保持基础纯色，压缩图模糊层与高清层由下层 div 承载 */
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        display: flex;
        justify-content: flex-start;
        padding: clamp(32px, 6vw, 64px) 16px clamp(32px, 6vw, 64px) clamp(32px, 5vw, 80px);
        position: relative;
        overflow-x: hidden;
    }

    /* 背景装饰光斑 */
    body::before, body::after {
        content: "";
        position: fixed;
        z-index: -1;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.5;
        pointer-events: none;
    }
    body::before {
        width: 480px; height: 480px;
        background: rgba(79, 110, 247, .16);
        top: -160px; right: -120px;
    }
    body::after {
        width: 420px; height: 420px;
        background: rgba(129, 140, 248, .14);
        bottom: -140px; left: -120px;
    }

    /* 压缩图模糊层：初始立即显示，高斯模糊实现毛玻璃效果 */
    #bgBlur {
        position: fixed;
        inset: 0;
        z-index: -2;
        background: url('static/img/background.webp') no-repeat center center / cover;
        filter: blur(10px);
        transform: scale(1.1);          /* 放大避免模糊后边缘露底色 */
        pointer-events: none;
    }

    /* 高清背景层：默认隐藏，高清图加载完成后淡入，不阻塞页面交互 */
    #bgLayer {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: var(--bg) no-repeat center center / cover;
        opacity: 0;
        transition: opacity .8s ease;
        pointer-events: none;
    }
    #bgLayer.loaded { opacity: 1; }

    .container { width: 100%; max-width: 620px; }

    header { text-align: center; margin-bottom: 32px; }
    header h1 {
        font-size: clamp(22px, 4.5vw, 28px);
        font-weight: 800;
        letter-spacing: -.5px;
        background: linear-gradient(120deg, #0f172a 30%, var(--accent-deep));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    header p {
        font-size: 14px;
        color: var(--fg-muted);
        margin-top: 12px;
        display: inline-block;
        padding: 6px 16px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 999px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
    }

    /* ===== 左右分栏布局：左侧方法栏 + 右侧工具区 ===== */
    .layout {
        display: flex;
        gap: 28px;
        align-items: flex-start;
        width: 100%;
        max-width: 1380px;
    }
    .layout .container { margin: 0 auto; flex: 0 1 620px; }

    .sidebar {
        flex: 0 0 340px;
        width: 340px;
        position: sticky;
        top: clamp(32px, 6vw, 64px);
        background: #fbfcfe;             /* 与右侧输入框同款底色 */
        border: 1px solid var(--border); /* 与右侧输入框同款外边框 */
        border-radius: var(--radius-md);
        padding: 16px 14px 14px;
        max-height: calc(100vh - 112px);
        overflow-y: auto;
        scrollbar-width: none;          /* Firefox：隐藏滚动条，保留滚轮滚动 */
        -ms-overflow-style: none;
    }
    .sidebar::-webkit-scrollbar { width: 0; height: 0; display: none; }
    .sidebar-head {
        font-size: 14px;
        font-weight: 800;
        color: var(--fg);
        padding: 0 4px 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }
    .sidebar-head small { font-size: 11px; color: var(--fg-faint); font-weight: 600; }
    .speed-summary {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0 2px 10px;
        padding: 5px 11px;
        font-size: 11px;
        font-weight: 600;
        color: var(--fg-muted);
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 999px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
        white-space: nowrap;
        overflow: hidden;
    }
    .speed-summary::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ok);
        flex: none;
        box-shadow: 0 0 0 3px rgba(5, 150, 105, .15);
    }
    .speed-summary b { color: var(--fg); font-weight: 700; }
    .speed-btn {
        flex: none;
        height: 26px;
        padding: 0 10px;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, #5b7cfa, var(--accent-deep));
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        box-shadow: 0 3px 8px -3px rgba(59, 91, 219, .5);
    }
    .speed-btn:hover:not(:disabled) { transform: translateY(-1px); filter: saturate(1.1); }
    .speed-btn:active:not(:disabled) { transform: scale(.97); }
    .method-speed {
        margin-left: auto;
        flex: none;
        font-size: 10.5px;
        font-weight: 700;
        color: #047857;
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        border-radius: 999px;
        padding: 2px 8px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        cursor: default;
        box-shadow: 0 1px 2px rgba(5, 150, 105, .12);
        transition: transform .15s, box-shadow .15s, filter .15s;
    }
    .method-speed::before {
        content: '';
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        flex: none;
    }
    .method-speed:hover { transform: translateY(-1px); filter: brightness(1.02); box-shadow: 0 2px 6px rgba(5, 150, 105, .25); }
    .method-speed.slow { color: #b45309; background: #fffbeb; border-color: #fde68a; box-shadow: 0 1px 2px rgba(245, 158, 11, .15); }
    .method-speed.slow:hover { box-shadow: 0 2px 6px rgba(245, 158, 11, .28); }
    .method-speed.bad { color: var(--danger-fg); background: var(--danger-bg); border-color: var(--danger-border); box-shadow: 0 1px 2px rgba(185, 28, 28, .12); }
    .method-speed.bad:hover { box-shadow: 0 2px 6px rgba(185, 28, 28, .25); }
    .method-speed.cors { color: #475569; background: #f1f5f9; border-color: #e2e8f0; box-shadow: 0 1px 2px rgba(71, 85, 105, .12); }
    .method-speed.cors:hover { box-shadow: 0 2px 6px rgba(71, 85, 105, .22); }
    .method-list {
        display: flex;
        flex-direction: column;
        gap: 3px;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }
    .method-list::-webkit-scrollbar { width: 0; height: 0; display: none; }
    .method-item {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 8px 10px 9px;
        border: 2px solid transparent;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: border-color .15s, background .15s, transform .15s;
        -webkit-user-select: none;
        user-select: none;
    }
    .method-item:hover:not(.active) { background: var(--accent-soft); }
    .method-item input { position: absolute; opacity: 0; pointer-events: none; }
    .method-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .method-num {
        flex: none;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: .5px;
        color: var(--accent-deep);
        background: var(--accent-soft);
        border-radius: 999px;
        padding: 1px 7px;
    }
    .method-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13.5px;
        font-weight: 700;
        color: var(--fg);
    }
    .method-desc {
        font-size: 10.5px;
        line-height: 1.35;
        color: var(--fg-muted);
        word-break: break-all;
        font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
    }
    .method-note { font-size: 10px; line-height: 1.35; margin-top: 1px; color: var(--fg-faint); }
    .method-item.active {
        border-color: var(--accent-deep);
        background: linear-gradient(135deg, #5b7cfa, var(--accent-deep));
        box-shadow: 0 4px 14px -4px rgba(59, 91, 219, .6);
    }
    .method-item.active::before {
        content: '';
        position: absolute;
        left: 3px;
        top: 9px;
        bottom: 9px;
        width: 3px;
        border-radius: 3px;
        background: #fff;
    }
    .method-item.active .method-name { color: #fff; }
    .method-item.active .method-desc { color: rgba(255, 255, 255, .9); }
    .method-item.active .method-note { color: rgba(255, 255, 255, .78); }
    .method-item.active .method-num { background: rgba(255, 255, 255, .2); color: #fff; }
    /* 选中态：速度徽章保留各自状态底色（绿=快 / 黄=慢 / 红=不可用 / 灰=受限·未知），
       不随选中态渲染成蓝色；白色描边用于与蓝色背景区分 */
    .method-item.active .method-speed {
        color: #047857;
        background: #ecfdf5;
        border-color: #a7f3d0;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, .35);
    }
    .method-item.active .method-speed.slow {
        color: #b45309;
        background: #fffbeb;
        border-color: #fde68a;
    }
    .method-item.active .method-speed.bad {
        color: var(--danger-fg);
        background: var(--danger-bg);
        border-color: var(--danger-border);
    }
    .method-item.active .method-speed.cors {
        color: #475569;
        background: #f1f5f9;
        border-color: #e2e8f0;
    }

    /* 速度进度条：相对最快通道的占比，仿测速报告条形图 */
    .method-bar {
        display: block;
        width: 100%;
        height: 10px;
        margin-top: 8px;
        border-radius: 999px;
        background: #e8edf3;
        overflow: hidden;
    }
    .method-bar i {
        display: block;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #34d399, #059669);
        animation: growBar .8s cubic-bezier(.22, .8, .3, 1);
    }
    @keyframes growBar { from { width: 0; } }
    .method-bar i.bar-slow { background: linear-gradient(90deg, #fbbf24, #d97706); }
    .method-bar i.bar-cors { background: linear-gradient(90deg, #94a3b8, #64748b); }
    .method-bar i.bar-bad  { background: linear-gradient(90deg, #f87171, #dc2626); }
    .method-item.active .method-bar { background: rgba(255, 255, 255, .18); }
    .method-item.active .method-bar i { background: linear-gradient(90deg, #fff, #e0e7ff); }

    /* 悬停测速数据浮层（深色卡片，仿测速报告头部风格） */
    .speed-tip {
        position: fixed;
        z-index: 1200;
        min-width: 196px;
        max-width: 260px;
        background: #0d1117;
        color: #e6edf3;
        border: 1px solid rgba(255, 255, 255, .08);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 12px;
        line-height: 1.5;
        box-shadow: 0 16px 40px -8px rgba(13, 17, 23, .5);
        opacity: 0;
        transform: translateY(4px);
        pointer-events: none;
        transition: opacity .16s ease, transform .16s ease;
    }
    .speed-tip.show { opacity: 1; transform: translateY(0); }
    .speed-tip .tip-name { font-size: 11px; color: #8b949e; margin-bottom: 2px; }
    .speed-tip .tip-speed {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -.2px;
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 8px;
        font-variant-numeric: tabular-nums;
    }
    .speed-tip .tip-dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; flex: none; }
    .speed-tip .tip-dot.slow { background: #d29922; }
    .speed-tip .tip-dot.cors { background: #8b949e; }
    .speed-tip .tip-dot.bad  { background: #f85149; }
    .speed-tip .tip-dot.none { background: #6e7681; }
    .speed-tip .tip-dot.unknown { background: #8b949e; }
    .speed-tip .tip-rows { border-top: 1px solid rgba(255, 255, 255, .08); padding-top: 8px; }
    .speed-tip .tip-rows div {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 11.5px;
        color: #8b949e;
        margin-top: 3px;
    }
    .speed-tip .tip-rows b { color: #e6edf3; font-weight: 600; font-variant-numeric: tabular-nums; }
    .speed-tip .tip-status { margin-top: 8px; font-size: 11px; color: #8b949e; }
    .speed-tip .tip-status b { color: #e6edf3; }

    /* 侧栏内自定义前缀输入行（卡片式：渐变头部 + 输入框，无阴影） */
    .sidebar .custom-row {
        margin: 10px 2px 0;
        padding: 0 0 10px;
        border: 1px solid #dbe4f0;
        border-radius: var(--radius-md);
        background: #fbfcfe;
        overflow: hidden;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
    }
    .sidebar .custom-row .custom-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 7px 12px;
        background: linear-gradient(135deg, #eef2ff, #f8faff);
        border-bottom: 1px solid #e2e8f0;
    }
    .sidebar .custom-row .custom-label {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .5px;
        color: var(--accent-deep);
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .sidebar .custom-row .custom-label::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--accent-deep);
        flex: none;
    }
    .sidebar .custom-row .custom-tag {
        font-size: 9.5px;
        font-weight: 700;
        color: var(--accent-deep);
        background: rgba(59, 91, 219, .1);
        border-radius: 999px;
        padding: 1px 7px;
    }
    .sidebar #customPrefix {
        width: calc(100% - 24px);
        margin: 0 12px;
        height: 34px;
        padding: 0 11px;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        outline: none;
        background: #fff;
        transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .sidebar #customPrefix:hover { border-color: #cbd5e1; }
    .sidebar #customPrefix:focus {
        border-color: var(--accent);
        background: #fff;
    }
    .sidebar #customPrefix::placeholder { color: #a8b3c5; }

    /* 侧栏底部帮助按钮：点击弹出「无法下载？」提示弹窗 */
    .help-btn {
        width: 100%;
        margin: 12px 2px 0;
        padding: 11px 13px;
        background: linear-gradient(135deg, #eef2ff, #f8faff);
        border: 1px solid #dbe4f0;
        border-radius: var(--radius-md);
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 800;
        color: var(--accent-deep);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        transition: border-color .15s, box-shadow .15s, transform .12s, filter .15s;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
    }
    .help-btn::before {
        content: '?';
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--accent-deep);
        color: #fff;
        font-size: 11px;
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
    }
    .help-btn:hover:not(:disabled) {
        border-color: var(--accent);
        box-shadow: 0 4px 12px -4px rgba(59, 91, 219, .35);
        transform: translateY(-1px);
        filter: saturate(1.05);
    }
    .help-btn:active:not(:disabled) { transform: scale(.97); }

    /* 提示弹窗 */
    .modal-mask {
        position: fixed;
        inset: 0;
        z-index: 2000;
        background: rgba(15, 23, 42, .45);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        animation: maskIn .2s ease;
    }
    @keyframes maskIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
        width: 100%;
        max-width: 430px;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 24px 60px -12px rgba(15, 23, 42, .45);
        overflow: hidden;
        animation: modalIn .28s cubic-bezier(.2, .8, .3, 1);
    }
    @keyframes modalIn {
        from { opacity: 0; transform: translateY(14px) scale(.97); }
        to   { opacity: 1; transform: none; }
    }
    .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 20px 12px;
        font-size: 16px;
        font-weight: 800;
        color: var(--fg);
        border-bottom: 1px solid var(--border);
    }
    .modal-close {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #f1f5f9;
        border: 0;
        color: var(--fg-muted);
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background .15s, color .15s;
    }
    .modal-close:hover { background: #e2e8f0; color: var(--fg); }
    .modal-body { padding: 16px 20px 20px; font-size: 13.5px; line-height: 1.8; color: var(--fg-muted); }
    .modal-body ul { margin: 0; padding-left: 18px; }
    .modal-body li { margin-top: 8px; }
    .modal-body li:first-child { margin-top: 0; }
    .modal-body b { color: var(--fg); font-weight: 700; }
    .modal-body .hl {
        background: var(--accent-soft);
        color: var(--accent-deep);
        padding: 1px 7px;
        border-radius: 6px;
        font-weight: 700;
    }

    /* 窄屏：侧栏转为顶部横向滚动条，工具区恢复居中 */
    @media (max-width: 860px) {
        .layout { flex-direction: column; gap: 14px; }
        .layout .container { margin: 0 auto; }
        .sidebar {
            flex: none;
            width: 100%;
            position: static;
            max-height: none;
            padding: 12px;
        }
        .sidebar-head { padding-bottom: 10px; }
        .method-list { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
        .method-item { flex: 0 0 220px; }
        .sidebar .custom-row { margin-top: 8px; }
    }

    /* ===== 自定义前缀输入行 ===== */
    .custom-row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: -4px 0 14px;
        padding: 10px 14px;
        background: #fff;
        border: 1px dashed var(--accent);
        border-radius: var(--radius-md);
    }
    .custom-row .custom-label { font-size: 12px; font-weight: 700; color: var(--accent-deep); flex: none; }
    #customPrefix {
        flex: 1;
        min-width: 0;
        height: 36px;
        padding: 0 12px;
        font-size: 13px;
        font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        outline: none;
        background: #fbfcfe;
    }
    #customPrefix:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-soft); }

    /* ===== 输入卡片（原样，无蛇干扰） ===== */
    .card {
        background: var(--card);
        border: 2px solid #1e293b;
        border-radius: var(--radius-lg);
        padding: 22px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, .18), 0 2px 6px rgba(0, 0, 0, .12);
    }

    .input-row { display: flex; gap: 10px; flex-wrap: wrap; }
    #urlInput {
        flex: 1 1 220px;
        min-width: 0;
        height: 46px;
        padding: 0 15px;

    .error {

    #btnCopy:active:not(:disabled) { transform: scale(.97); }
    #btnCopy.copied { border-color: #34d399; color: var(--ok); background: #ecfdf5; box-shadow: 0 3px 10px -2px rgba(5, 150, 105, .35); }

    #linkVisit {

        border-radius: var(--radius-sm);
        box-shadow: 0 3px 10px -2px rgba(15, 23, 42, .45);

    #linkVisit:hover {
        border-color: #1e293b;

        box-shadow: 0 5px 14px -2px rgba(15, 23, 42, .5);

    #sourceNote { font-size: 12px; color: var(--fg-faint); }

    footer {
        margin-top: 32px;
        text-align: center;

        line-height: 1.9;
    }

    .hidden { display: none !important; }

    /* ===== 新增：独立蛇模块（在输入卡片下方，留足空间，带透视效果） ===== */
.snake-module {
    margin-top: 30px;          /* 与输入卡片保持距离，可自行调整 */
    padding: 0px 0;           /* 上下留一点空间，让蛇图不紧贴上下边缘（可选） */
    display: flex;
    justify-content: center;
    align-items: center;
    /* 移除所有背景、边框、阴影、模糊 */
}

    .snake-module img {
        display: block;
        width: 140%;                    /* 占满模块宽度 */
        max-width: 700px;               /* 限制最大宽度，避免过大 */
        height: auto;                   /* 保持纵横比，防止拉伸变形 */
        filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
        -webkit-user-drag: none;        /* 禁止拖拽 */
        user-select: none;              /* 禁止选中 */
        -webkit-user-select: none;
        pointer-events: none;           /* 不接收鼠标点击事件 */
    }

    /* 移动端适配 */
    @media (max-width: 520px) {
        body { padding: 20px 14px; }
        .card { padding: 16px; border-radius: 14px; }

        header p { font-size: 13px; padding: 5px 12px; }
        #urlInput { height: 48px; font-size: 16px; }
        #urlInput, #btnExtract { border-radius: var(--radius-sm); }
        #btnExtract { flex: 1 1 100%; justify-content: center; }
        #iconPreview { width: 44px; height: 44px; }
        .result-head, .result-actions { gap: 10px; }
        body::before, body::after { opacity: .35; }
        #bgBlur { filter: blur(6px); }  /* 移动端降低模糊，兼顾性能 */
        .snake-module {
            min-height: 160px;
            padding: 20px 15px;
        }
        .snake-module img { max-width: 300px; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
    }
</style>
</head>
<body>
<!-- 压缩图模糊层（毛玻璃效果，初始立即显示） -->
<div id="bgBlur" aria-hidden="true"></div>
<!-- 高清背景层（background1.webp 异步加载完成后淡入） -->
<div id="bgLayer" aria-hidden="true"></div>
<div class="layout">
    <!-- 左侧栏：方法 1~N 选择（加速通道设置面板） -->
    <aside class="sidebar">
        <div class="sidebar-head">
            <span>加速通道</span>
            <button id="btnSpeed" class="speed-btn" type="button">⇅ 测速排序</button>
        </div>
        <div class="speed-summary" id="speedSummary">点击「⇅ 测速排序」开始测速</div>
        <div class="method-list" id="methodList" role="radiogroup" aria-label="选择加速通道"></div>
        <div class="custom-row hidden" id="customRow">
            <div class="custom-head">
                <span class="custom-label">自定义前缀</span>
                <span class="custom-tag">备用通道</span>
            </div>
            <input id="customPrefix" type="text" spellcheck="false" autocomplete="off"
                   placeholder="https://你的加速前缀/（末尾自动补 /）">
        </div>
        <button class="help-btn" id="helpBtn" type="button">无法下载？</button>
    </aside>

    <!-- 无法下载？提示弹窗 -->
    <div class="modal-mask hidden" id="helpMask">
        <div class="modal" role="dialog" aria-modal="true" aria-label="无法下载">
            <div class="modal-head">
                <span>无法下载？</span>
                <button class="modal-close" id="helpClose" type="button" aria-label="关闭">✕</button>
            </div>
            <div class="modal-body">
                <ul>
                    <li>卡在最后一点一直没完成：多半是连接被掐断，换 <b>Chrome / Edge / Firefox</b> 等浏览器重试</li>
                    <li>也可以点「⇅ 测速排序」，切换到其他可用通路再试</li>
                    <li>想要更高速率：多数加速站的高速节点需注册并购买 <b>VIP / 会员</b>，免费公益通道通常限速、不稳定</li>
                    <li>如果你有自己搭的或买的通路：选「<span class="hl">自定义前缀</span>」通道，在下方输入你的加速地址即可</li>
                </ul>
            </div>
        </div>
    </div>

    <main class="container">
    <header>
        <h1>下载器</h1>
    </header>

    <script>
    (function() {
        'use strict';
        // 通路配置：前两个为你的自建通道，后几个为公共冗余通道，可自行增删
        // 已弃用（不再测速/排序/显示）：gh.llkk.cc、kkgithub 镜像、jsDelivr CDN
        // type: prefix=前缀拼接 | replace=域名替换 | custom=自定义前缀
        var PROXY_CHANNELS = [
            { type: 'prefix',   name: '通用（小帅）',       value: 'https://g.z321.cc.cd/',     desc: 'https://g.z321.cc.cd/',     note: '你的小帅通道，任意直链' },
            { type: 'prefix',   name: 'GitHub 专用（小帅）', value: 'https://777.z321.cc.cd/',   desc: 'https://777.z321.cc.cd/',   note: '你的小帅通道，GitHub 文件' },
            { type: 'prefix',   name: 'gh-proxy.com',       value: 'https://gh-proxy.com/',     desc: 'https://gh-proxy.com/',     note: 'Release / Raw / Archive / Clone' },
            { type: 'prefix',   name: 'ghproxy.net',        value: 'https://ghproxy.net/',      desc: 'https://ghproxy.net/',      note: 'Release / Archive / 单文件' },
            { type: 'prefix',   name: 'gh-proxy.at9.net',   value: 'https://gh-proxy.at9.net/', desc: 'https://gh-proxy.at9.net/', note: 'Release / Raw / 直链（部分链路待验证）' },
            { type: 'custom',   name: '自定义前缀',          value: '__custom__',               desc: '粘贴任意加速前缀',           note: '自己填加速站前缀，防单点失效' }
        ];

        /* ===== 测速 =====
           测试文件：git 仓库源码包（约 13MB，稳定），各前缀通道用同一文件测真实吞吐。
           每通道最多读取 1MB 或 4 秒，几秒内完成全部测试。
           公共代理站均允许跨域，浏览器端可直接实测用户到代理的真实速度。 */
        var TEST_URL = 'https://github.com/git/git/archive/refs/heads/master.zip';
        var MAX_BYTES = 1024 * 1024;   // 单通道最多读取 1MB
        var MAX_TIME = 4000;           // 单通道读取上限 4 秒
        var TIMEOUT = 10000;           // 连接超时

        var list = document.getElementById('methodList');
        var speedTested = false;   // 是否已执行过测速（测速后隐藏不可用通路）
        var testing = false;       // 防重入：手动与自动测速不并发

        /* 与主脚本闭包内的转换保持一致（主脚本作用域不可见，此处复制一份，勿单独改动） */
        function kkGitHubUrl(url) {
            var u = new URL(url);
            if (u.hostname === 'raw.githubusercontent.com') u.hostname = 'raw.kkgithub.com';
            else u.hostname = 'kkgithub.com';
            return u.href;
        }

        function testUrlFor(c) {
            if (c.type === 'custom') {
                var p = (document.getElementById('customPrefix') || {}).value || '';
                p = p.trim();
                if (!/^https?:\/\//i.test(p)) return '';
                return p.replace(/\/+$/, '') + '/' + TEST_URL;
            }
            if (c.type === 'prefix') return c.value + TEST_URL;
            if (c.type === 'replace') return kkGitHubUrl(TEST_URL);
            return '';
        }

        function formatSpeed(kbps) {
            if (kbps >= 1024) return (kbps / 1024).toFixed(2) + ' MB/s';
            return Math.round(kbps) + ' KB/s';
        }

        function measure(url) {
            return new Promise(function(resolve) {
                var started = Date.now();
                var ctrl = ('AbortController' in window) ? new AbortController() : null;
                var timer = setTimeout(function() { if (ctrl) ctrl.abort(); }, TIMEOUT);
                function done(obj) { clearTimeout(timer); resolve(obj); }
                var opts = { cache: 'no-store' };
                if (ctrl) opts.signal = ctrl.signal;
                fetch(url, opts).then(function(res) {
                    if (!res.ok) { done({ ok: false, err: 'http ' + res.status }); return; }
                    if (!res.body || !res.body.getReader) {
                        done({ ok: true, ttfb: Date.now() - started, total: 0, ms: Date.now() - started });
                        return;
                    }
                    var ttfb = Date.now() - started;
                    var reader = res.body.getReader();
                    var total = 0;
                    function pump() {
                        var elapsed = Date.now() - started;
                        if (elapsed >= MAX_TIME) {
                            reader.cancel();
                            done({ ok: true, ttfb: ttfb, total: total, ms: elapsed });
                            return;
                        }
                        reader.read().then(function(r) {
                            if (r.done) { done({ ok: true, ttfb: ttfb, total: total, ms: Date.now() - started }); return; }
                            total += r.value ? r.value.length : 0;
                            if (total >= MAX_BYTES) {
                                reader.cancel();
                                done({ ok: true, ttfb: ttfb, total: total, ms: Date.now() - started });
                                return;
                            }
                            pump();
                        }).catch(function() {
                            done({ ok: true, ttfb: ttfb, total: total, ms: Date.now() - started });
                        });
                    }
                    pump();
                }).catch(function(e) {
                    if (e && e.name === 'AbortError') { done({ ok: false, err: 'timeout' }); return; }
                    // 可能只是禁止跨域读取（CORS）而非不可达：用 no-cors 探测区分
                    reachable(url).then(function(ok) {
                        done({ ok: false, err: ok ? 'cors' : 'unreachable' });
                    });
                });
            });
        }

        // no-cors 可达性探测：能收到响应头即说明站点可达（即使禁止网页跨域读取）
        function reachable(url) {
            return new Promise(function(resolve) {
                var ctrl = ('AbortController' in window) ? new AbortController() : null;
                var t = setTimeout(function() { if (ctrl) ctrl.abort(); }, 5000);
                var opts = { method: 'GET', mode: 'no-cors', cache: 'no-store' };
                if (ctrl) opts.signal = ctrl.signal;
                fetch(url, opts).then(function() {
                    clearTimeout(t);
                    if (ctrl) ctrl.abort();   // 收到响应头即停，避免继续下载
                    resolve(true);
                }).catch(function() {
                    clearTimeout(t);
                    resolve(false);
                });
            });
        }

        function renderMethods() {
            if (!list) return;
            var checked = list.querySelector('input:checked');
            var checkedVal = checked ? checked.value : '';
            // 测速后保留全部通路（不可用/超时标注为「未知」），可见项重新编号
            var visible = PROXY_CHANNELS.slice();
            // 计算最快通道速度，用于进度条占比
            var maxK = 0;
            for (var k = 0; k < visible.length; k++) {
                if (visible[k].kbps > maxK) maxK = visible[k].kbps;
            }
            var html = '';
            for (var j = 0; j < visible.length; j++) {
                var c = visible[j];
                var isChecked = (c.value === checkedVal) || (!checkedVal && j === 0);
                var badge = c.speedText || '';
                var cls = 'method-speed';
                var barCls = 'bar-ok';
                var status = 'none';
                if (badge && !c.ok) {
                    if (c.unknown) {
                        cls += ' cors';            // 未知：中性灰色徽章
                        barCls = 'bar-cors';
                        status = 'unknown';
                    } else {
                        cls += (c.corsOnly ? ' cors' : ' bad');
                        barCls = c.corsOnly ? 'bar-cors' : 'bar-bad';
                        status = c.corsOnly ? 'cors' : 'bad';
                    }
                } else if (badge && c.ok) {
                    status = (c.kbps > 0 && c.kbps < 1024) ? 'slow' : 'ok';
                    if (c.kbps > 0 && c.kbps < 1024) { cls += ' slow'; barCls = 'bar-slow'; }
                }
                var pct = (c.ok && maxK > 0 && c.kbps > 0) ? Math.max(4, Math.round(c.kbps / maxK * 100)) : 0;
                var bar = (badge && c.ok && c.kbps > 0) ? '<span class="method-bar"><i class="' + barCls + '" style="width:' + pct + '%"></i></span>' : '';
                var dataAttrs = ' data-name="' + c.name + '"'
                        + ' data-speed="' + (c.speedText || '') + '"'
                        + ' data-ttfb="' + (c.ttfb || 0) + '"'
                        + ' data-total="' + (c.total || 0) + '"'
                        + ' data-ms="' + (c.ms || 0) + '"'
                        + ' data-status="' + status + '"';
                html += '<label class="method-item' + (isChecked ? ' active' : '') + '"' + dataAttrs + '>' +
                        '<input type="radio" name="method" value="' + c.value + '" data-type="' + c.type + '"' + (isChecked ? ' checked' : '') + '>' +
                        '<span class="method-row"><span class="method-num">通路' + (j + 1) + '</span><span class="method-name">' + c.name + '</span>' +
                        (badge ? '<span class="' + cls + '">' + badge + '</span>' : '') +
                        '</span>' +
                        bar +
                        '</label>';
            }
            list.innerHTML = html;
        }

        function selectMethod(value) {
            if (!list) return;
            var inputs = list.querySelectorAll('input[name="method"]');
            for (var i = 0; i < inputs.length; i++) {
                if (inputs[i].value === value) inputs[i].checked = true;
            }
            list.dispatchEvent(new Event('change'));
        }

        function runSpeedTest(btn) {
            if (testing) return;   // 防止手动与自动测速并发
            testing = true;
            btn.disabled = true;
            speedTested = true;   // 测速后按结果隐藏不可用通路
            var oldText = btn.textContent;
            btn.textContent = '测速中…';

            var jobs = PROXY_CHANNELS.map(function(c) {
                var u = testUrlFor(c);
                if (!u) return Promise.resolve({ ok: false, err: 'noprefix' });
                return measure(u);
            });

            Promise.all(jobs).then(function(results) {
                results.forEach(function(r, i) {
                    var c = PROXY_CHANNELS[i];
                    c.ok = r.ok;
                    c.corsOnly = false;
                    c.unknown = false;
                    c.hide = false;   // 不再隐藏任何通路：不可用/超时保留并标注「未知」
                    c.ttfb = r.ttfb || 0;
                    c.total = r.total || 0;
                    c.ms = r.ms || 0;
                    c.kbps = (r.ms > 0 && r.total > 0) ? (r.total / 1024) / (r.ms / 1000) : 0;
                    if (r.total > 0 && r.total < 65536) c.kbps = 0;   // 小文件只测连接时间
                    if (r.ok) {
                        if (r.total >= 65536) c.speedText = formatSpeed(c.kbps);
                        else c.speedText = '连接 ' + c.ttfb + 'ms';
                    } else if (r.err === 'timeout') { c.speedText = '未知'; c.unknown = true; }
                    else if (r.err === 'noprefix') { c.speedText = '未填前缀'; }
                    else if (r.err === 'cors') { c.speedText = 'CORS受限'; c.corsOnly = true; }
                    else { c.speedText = '未知'; c.unknown = true; }
                });

                // 排序：可用有吞吐(3) → 可用仅连接(2) → CORS受限可下载(1) → 不可用/未知(0)；组内按速度降序 / 连接升序
                PROXY_CHANNELS.sort(function(a, b) {
                    function grp(x) {
                        if (x.ok) return (x.kbps > 0) ? 3 : 2;
                        if (x.corsOnly) return 1;
                        return 0;
                    }
                    var ga = grp(a), gb = grp(b);
                    if (ga !== gb) return gb - ga;
                    if (ga === 3) {
                        if (a.kbps !== b.kbps) return b.kbps - a.kbps;
                        return (a.ttfb || 0) - (b.ttfb || 0);
                    }
                    if (ga === 2 || ga === 1) return (a.ttfb || 0) - (b.ttfb || 0);
                    return 0;
                });

                renderMethods();

                // 自动选中最快可用方法（自定义未填前缀等不可用项跳过）
                for (var i = 0; i < PROXY_CHANNELS.length; i++) {
                    if (PROXY_CHANNELS[i].ok) { selectMethod(PROXY_CHANNELS[i].value); break; }
                }

                // 更新侧栏测速摘要：测速时间 + 当前最快通道
                var sum = document.getElementById('speedSummary');
                if (sum) {
                    var fastest = null;
                    for (var i2 = 0; i2 < PROXY_CHANNELS.length; i2++) {
                        if (PROXY_CHANNELS[i2].ok && PROXY_CHANNELS[i2].kbps > 0) { fastest = PROXY_CHANNELS[i2]; break; }
                    }
                    if (fastest) {
                        var now = new Date();
                        var hh = ('0' + now.getHours()).slice(-2);
                        var mm = ('0' + now.getMinutes()).slice(-2);
                        sum.innerHTML = '上次测速 ' + hh + ':' + mm + ' · 最快 <b>' + fastest.name + ' ' + fastest.speedText + '</b>';
                    } else {
                        sum.innerHTML = '测速完成 · 暂无可用通道';
                    }
                }

                btn.disabled = false;
                btn.textContent = oldText;
                testing = false;
            });
        }

        /* ===== 悬停浮层：展示该通道的测速明细（速度 / TTFB / 读取量 / 耗时 / 状态） ===== */
        var TIP_STATUS = { ok: '通道可用', slow: '速度较慢', cors: 'CORS 受限 · 可直接下载', bad: '通道不可用', unknown: '未知', none: '尚未测速' };

        function fmtBytes(b) {
            b = +b || 0;
            if (b <= 0) return '—';
            if (b >= 1048576) return (b / 1048576).toFixed(2) + ' MB';
            if (b >= 1024) return Math.round(b / 1024) + ' KB';
            return b + ' B';
        }

        function fmtMs(ms) {
            ms = +ms || 0;
            if (ms >= 1000) return (ms / 1000).toFixed(1) + ' s';
            return ms + ' ms';
        }

        function buildTipHTML(item) {
            var name = item.getAttribute('data-name') || '';
            var speed = item.getAttribute('data-speed') || '';
            var ttfb = +item.getAttribute('data-ttfb') || 0;
            var total = +item.getAttribute('data-total') || 0;
            var ms = +item.getAttribute('data-ms') || 0;
            var status = item.getAttribute('data-status') || 'none';
            if (!speed && !ttfb && !total) {
                return '<div class="tip-name">' + name + '</div>' +
                       '<div class="tip-speed"><span class="tip-dot none"></span>未测速</div>' +
                       '<div class="tip-status">点击「⇅ 测速排序」开始测速</div>';
            }
            var rows = '';
            if (ttfb > 0) rows += '<div><span>首包 TTFB</span><b>' + ttfb + ' ms</b></div>';
            if (total > 0) rows += '<div><span>读取数据</span><b>' + fmtBytes(total) + '</b></div>';
            if (ms > 0) rows += '<div><span>测试耗时</span><b>' + fmtMs(ms) + '</b></div>';
            return '<div class="tip-name">' + name + '</div>' +
                   '<div class="tip-speed"><span class="tip-dot ' + status + '"></span>' + (speed || '—') + '</div>' +
                   (rows ? '<div class="tip-rows">' + rows + '</div>' : '') +
                   '<div class="tip-status">状态：<b>' + (TIP_STATUS[status] || status) + '</b></div>';
        }

        var tipEl = document.createElement('div');
        tipEl.className = 'speed-tip';
        document.body.appendChild(tipEl);

        function placeTip(item) {
            tipEl.innerHTML = buildTipHTML(item);
            tipEl.classList.add('show');
            tipEl.style.width = '';
            var rect = item.getBoundingClientRect();
            var tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
            var sb = document.querySelector('.sidebar');
            var sbRect = sb ? sb.getBoundingClientRect() : rect;
            var gap = 2;
            // 水平方向：与左边栏右边框贴合（黑框左缘紧贴侧栏边框外侧），右侧空间不足时翻转到侧栏左侧
            var left = sbRect.right + gap;
            if (left + tw > window.innerWidth - 8) left = Math.max(8, sbRect.left - tw - gap);
            // 垂直方向：与对应选项顶部对齐；超出视口上下边界时收缩到视口内
            var top = rect.top;
            if (top + th > window.innerHeight - 8) top = Math.max(8, window.innerHeight - th - 8);
            tipEl.style.left = left + 'px';
            tipEl.style.top = top + 'px';
        }

        function hideTip() { tipEl.classList.remove('show'); }

        if (list) {
            list.addEventListener('mouseover', function(e) {
                var item = e.target && e.target.closest ? e.target.closest('.method-item') : null;
                if (item) placeTip(item);
            });
            list.addEventListener('mouseout', function(e) {
                var to = e.relatedTarget;
                if (to && to.closest && to.closest('.method-item')) return;   // 仍悬浮在某个通道项内
                hideTip();
            });
        }
        var sb = document.querySelector('.sidebar');
        if (sb) sb.addEventListener('scroll', hideTip, { passive: true });
        window.addEventListener('scroll', hideTip, { passive: true });
        window.addEventListener('resize', hideTip);

        // 初始渲染
        renderMethods();

        // 测速按钮
        var btn = document.getElementById('btnSpeed');
        if (btn) btn.addEventListener('click', function() { runSpeedTest(btn); });

        // 打开页面自动测速一次，之后每 5 分钟自动重测并重排（可手动随时触发）
        if (btn) {
            setTimeout(function() { runSpeedTest(btn); }, 1200);
            setInterval(function() { runSpeedTest(btn); }, 300000);
        }

        // 记住上次填的自定义前缀
        var cp = document.getElementById('customPrefix');
        if (cp) {
            try { var saved = localStorage.getItem('dlaccel_custom_prefix'); if (saved) cp.value = saved; } catch (e) {}
            cp.addEventListener('input', function() {
                try { localStorage.setItem('dlaccel_custom_prefix', cp.value); } catch (e) {}
            });
        }
    })();
    </script>

<script>
//（原有 JavaScript 完全保留，未做任何改动）
(function() {
    'use strict';

    var PLACEHOLDER = 'data:image/svg+xml,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48">' +
        '<rect width="48" height="48" rx="8" fill="#f0f0f0"/>' +
        '<text x="24" y="30" text-anchor="middle" font-size="20" fill="#bbb">?</text></svg>');

    var input = document.getElementById('urlInput');
    var btnExtract = document.getElementById('btnExtract');
    var btnExtractText = document.getElementById('btnExtractText');
    var errorBox = document.getElementById('errorBox');
    var resultCard = document.getElementById('resultCard');
    var iconPreview = document.getElementById('iconPreview');
    var iconUrl = document.getElementById('iconUrl');
    var btnCopy = document.getElementById('btnCopy');
    var linkVisit = document.getElementById('linkVisit');
    var sourceNote = document.getElementById('sourceNote');
    var cleanedOnce = false;   // 本次是否发生过代理前缀清洗
    var cleanUrl = '';         // 清洗后的纯净原始链接

    function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove('hidden');
    }
    function clearError() { errorBox.classList.add('hidden'); }

    function setLoading(on) {
        btnExtract.disabled = on;
        btnExtract.classList.toggle('loading', on);
        btnExtractText.textContent = on ? '提取中…' : '提取';
    }

    function showResult(data) {
        iconPreview.onerror = function() { iconPreview.src = PLACEHOLDER; };
        iconPreview.src = data.preview;
        iconUrl.textContent = data.url;
        linkVisit.href = data.preview;
        var note = data.source ? '来源：' + data.source : '';
        if (cleanedOnce) note = (note ? note + ' · ' : '') + '已自动清洗代理前缀';
        sourceNote.textContent = note;
        resultCard.classList.remove('hidden');
    }

    function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text).then(function() { return true; }, function() { return legacyCopy(text); });
        }
        return Promise.resolve(legacyCopy(text));
    }
    function legacyCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        return ok;
    }

    function rootDomain(h) {
        var m = h.toLowerCase().match(/([a-z0-9-]+\.(?:com|net|org|gov|edu|ac|co)\.[a-z]{2})$/);
        if (m) return m[1];
        m = h.toLowerCase().match(/([a-z0-9-]+\.[a-z]{2,})$/);
        return m ? m[1] : h;
    }

    function probeImg(url) {
        return new Promise(function(resolve) {
            var img = new Image();
            var done = false;
            function finish(ok) {
                if (done) return;
                done = true;
                img.onload = img.onerror = null;
                resolve(ok);
            }
            var t = setTimeout(function() { finish(false); }, 6000);
            img.onload = function() { clearTimeout(t); finish(true); };
            img.onerror = function() { clearTimeout(t); finish(false); };
            img.src = url;
        });
    }

    function browserProbeIcon(target) {
        var origins = [target.origin];
        var rd = rootDomain(target.hostname);
        if (rd !== target.hostname) origins.push('https://' + rd);
        var paths = ['/favicon.ico', '/favicon.png', '/apple-touch-icon.png'];
        var candidates = [];
        origins.forEach(function(o) { paths.forEach(function(p) { candidates.push(o + p); }); });
        return Promise.all(candidates.map(probeImg)).then(function(results) {
            for (var i = 0; i < candidates.length; i++) {
                if (results[i]) return candidates[i];
            }
            return '';
        });
    }

    function normalizeUrl(text) {
        var s = text.replace(/\s+/g, '');
        s = s.replace(/^(https?):\/(?!\/)/i, '$1://');
        if (/^https?:\/\//i.test(s)) { return s; }
        if (s.indexOf('//') === 0) { return 'https:' + s; }
        return 'https://' + s;
    }

    /* 自动清洗代理前缀：识别字符串中多个 http/https，
       截取最后一个协议头开始的完整原始链接，剥离前面所有代理域名，拿到纯净源站地址 */
    function cleanProxyUrl(text) {
        var s = text.replace(/\s+/g, '');
        var re = /https?:\/\//gi;
        var m, last = -1;
        while ((m = re.exec(s)) !== null) { last = m.index; }
        if (last > 0) {
            // 前面存在代理前缀，截取最后协议头开始的纯净链接
            s = s.slice(last);
            cleanedOnce = true;
        }
        return s;
    }

    /* 当前选中的代理通道（含类型）：读取左侧栏方法列表 */
    function currentChannel() {
        var checked = document.querySelector('#methodList input:checked');
        if (!checked) return { type: 'prefix', value: 'https://g.z321.cc.cd/' };
        return { type: checked.getAttribute('data-type'), value: checked.value };
    }

    /* 域名替换型通道：github.com → kkgithub.com，raw 走 raw.kkgithub.com */
    function kkGitHubUrl(url) {
        var u = new URL(url);
        if (u.hostname === 'raw.githubusercontent.com') u.hostname = 'raw.kkgithub.com';
        else u.hostname = 'kkgithub.com';
        return u.href;
    }

    /* 拼接加速链接：按通道类型生成 */
    function buildAccelLink() {
        var ch = currentChannel();
        if (ch.type === 'custom') {
            var p = (document.getElementById('customPrefix') || {}).value;
            if (!p) return '';
            p = p.trim();
            if (!/^https?:\/\//i.test(p)) return '';
            return p.replace(/\/+$/, '') + '/' + cleanUrl;
        }
        if (ch.type === 'prefix') return ch.value + cleanUrl;
        if (ch.type === 'replace') return kkGitHubUrl(cleanUrl);
        return ch.value + cleanUrl;
    }

    /* 校验当前通道是否支持该链接，返回 '' 表示支持，否则返回错误提示 */
    function channelAccepts(url) {
        var ch = currentChannel();
        if (ch.type !== 'replace') return '';
        var u;
        try { u = new URL(url); } catch (e) { return '链接格式不正确'; }
        if (u.hostname === 'github.com' || u.hostname === 'raw.githubusercontent.com') return '';
        return 'kkgithub 镜像仅支持 github.com / raw.githubusercontent.com 链接';
    }

    /* 校验清洗后的链接是否为有效下载链接：
       必须为合法 http(s) 链接，且为常见文件下载地址（带下载文件扩展名或 GitHub releases 下载路径） */
    function isValidDownloadLink(url) {
        var u;
        try { u = new URL(url); } catch (e) { return false; }
        if (u.protocol !== 'http:' && u.protocol !== 'https:') return false;
        var path = u.pathname.toLowerCase();
        var exts = ['zip', 'exe', 'msi', 'apk', 'dmg', 'pkg', 'deb', 'rpm', 'tar', 'gz', 'tgz',
                    'bz2', 'xz', '7z', 'rar', 'iso', 'bin', 'dll', 'appimage', 'jar', 'whl', 'ipa'];
        for (var i = 0; i < exts.length; i++) {
            if (path.slice(-exts[i].length - 1) === '.' + exts[i]) return true;
        }
        if (/\/releases\/download\//.test(path)) return true;
        if (u.hostname === 'raw.githubusercontent.com') return true;
        if (u.hostname === 'github.com' && (/\/raw\//.test(path) || /\/archive\//.test(path))) return true;
        return false;
    }

    function extract() {
        clearError();
        resultCard.classList.add('hidden');

        var raw = input.value.trim();
        if (!raw) { showError('请输入网址'); return; }

        cleanedOnce = false;
        var target;
        try {
            cleanUrl = normalizeUrl(cleanProxyUrl(raw));
            target = new URL(cleanUrl);
        } catch (e) {
            showError('网址格式不正确，请检查后重试');
            return;
        }

        setLoading(true);

        fetch('/api/extract?url=' + encodeURIComponent(target.href))
            .then(function(res) {
                return res.json().catch(function() { return null; }).then(function(data) { return { res: res, data: data }; });
            })
            .then(function(r) {
                var data = r.data && r.data.ok ? r.data : null;

                if (data && !data.fallback) { showResult(data); return null; }

                return browserProbeIcon(target).then(function(nativeUrl) {
                    if (nativeUrl) {
                        showResult({ url: nativeUrl, preview: nativeUrl, source: '本地探测 ' + nativeUrl.replace(/^https?:\/\//, '') });
                        return null;
                    }
                    if (data) { showResult(data); return null; }
                    showError((r.data && r.data.error) ? r.data.error : '未找到图标，请检查网址是否正确');
                });
            })
            .catch(function() {
                showError('请求失败，请检查网络后重试');
            })
            .then(function() { setLoading(false); });
    }

    btnExtract.addEventListener('click', extract);
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') extract();
    });

    btnCopy.addEventListener('click', function() {
        // 前置校验：无效下载链接禁止复制
        if (!isValidDownloadLink(cleanUrl)) {
            showError('请输入有效的下载链接');
            return;
        }
        var reason = channelAccepts(cleanUrl);
        if (reason) { showError(reason); return; }
        var link = buildAccelLink();
        if (!link) { showError('请先填写有效的自定义前缀'); return; }
        copyText(link).then(function(ok) {
            if (!ok) { showError('复制失败，请手动选中文本复制'); return; }
            clearError();
            btnCopy.textContent = '已复制 ✓';
            btnCopy.classList.add('copied');
            setTimeout(function() {
                btnCopy.textContent = '📋 复制地址';
                btnCopy.classList.remove('copied');
            }, 1500);
        });
    });

    // 在新标签页中打开：前置校验，无效则拦截；有效则打开拼接后的纯加速链接
    linkVisit.addEventListener('click', function(e) {
        if (!isValidDownloadLink(cleanUrl)) {
            e.preventDefault();
            showError('请输入有效的下载链接');
            return;
        }
        var reason = channelAccepts(cleanUrl);
        if (reason) { e.preventDefault(); showError(reason); return; }
        var link = buildAccelLink();
        if (!link) { e.preventDefault(); showError('请先填写有效的自定义前缀'); return; }
        e.preventDefault();
        window.open(link, '_blank', 'noopener,noreferrer');
    });
})();
</script>

<!-- 左侧栏方法选择逻辑：选中态高亮 + 自定义前缀输入行联动 -->
<script>
(function() {
    'use strict';
    var list = document.getElementById('methodList');
    if (!list) return;

    // 点击任一方法时同步高亮（label 内 radio 自动选中），并联动显示自定义前缀输入行
    list.addEventListener('change', function() {
        var items = list.querySelectorAll('.method-item');
        var checked = list.querySelector('input:checked');
        items.forEach(function(opt) {
            opt.classList.toggle('active', opt.querySelector('input') === checked);
        });
        var customRow = document.getElementById('customRow');
        if (customRow && checked) {
            var isCustom = checked.getAttribute('data-type') === 'custom';
            customRow.classList.toggle('hidden', !isCustom);
            if (isCustom) {
                var cp = document.getElementById('customPrefix');
                if (cp) cp.focus();
            }
        }
    });
})();
</script>

<script>
(function() {
    'use strict';
    var btn = document.getElementById('helpBtn');
    var mask = document.getElementById('helpMask');
    if (!btn || !mask) return;
    function openModal() { mask.classList.remove('hidden'); }
    function closeModal() { mask.classList.add('hidden'); }

<!-- 禁止贪吃蛇图片拖拽/选中：JS 级拦截，弥补 CSS 在不同浏览器上的兼容差异 -->
<script>
(function() {
    'use strict';
    var snakeImg = document.querySelector('.snake-module img');
    if (!snakeImg) return;

    // 阻止原生拖拽（含首次长按后浏览器将其置为可拖拽状态的场景）
    snakeImg.addEventListener('dragstart', function(e) {
        e.preventDefault();
        return false;
    }, true);
    // 阻止长按触发的系统拖拽/选中
    snakeImg.addEventListener('mousedown', function(e) {
        if (e.button === 0) e.preventDefault();
    }, true);
    // 阻止移动端长按系统菜单
    snakeImg.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    }, true);
})();
</script>

<script>
    (function() {
        'use strict';
        document.addEventListener('keydown', function(e) {
            var key = e.key || '';
            var blocked = false;
            if (key === 'F12') { blocked = true; }
            else if ((e.ctrlKey || e.metaKey) && !e.altKey && (key === 's' || key === 'S' || key === 'u' || key === 'U')) { blocked = true; }
            else if ((e.ctrlKey || e.metaKey) && e.shiftKey && (key === 'I' || key === 'i' || key === 'J' || key === 'j' || key === 'C' || key === 'c')) { blocked = true; }
            if (blocked) { e.preventDefault(); e.stopPropagation(); return false; }
        }, true);
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, true);
        function antiDebug() {
            setInterval(function() {
                var before = Date.now();
                debugger;
                if (Date.now() - before > 100) { document.body.innerHTML = ''; }
            }, 2000);
        }
        antiDebug();
    })();
</script>
